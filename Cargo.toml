[package]
name = "web-search"
version = "0.1.0-rc.1"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
anyhow = "1"
axum = "=0.8.9"
base64 = "0.22"
chromiumoxide = { version = "=0.9.1", default-features = false }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "=4.6.7", features = ["derive"] }
dom_query = "=0.29.0"
dom_smoothie = "=0.19.0"
futures = "0.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "query", "charset", "gzip", "brotli"] }
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "macros", "transport-io"] }
rusqlite = { version = "=0.41.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "time", "process", "sync", "io-util"] }
tracing = "=0.1.44"
utoipa = "=6.0.0"

[dev-dependencies]
rmcp = { version = "=3.8.0", default-features = false, features = ["client", "transport-child-process"] }
